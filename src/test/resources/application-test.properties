# Tests run against a permanently installed PostgreSQL with its own test database (no Testcontainers).
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/citeolivia_test}
spring.datasource.username=${TEST_DB_USER:citeolivia}
spring.datasource.password=${TEST_DB_PASSWORD:citeolivia}
# Allowed in tests only: Flyway rebuilds the schema from scratch (see TestFlywayConfig).
spring.flyway.clean-disabled=false
