<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{word/layout :: layout('Anmelden', ~{::main})}">
<body>
<main class="p-4">
    <form class="flex flex-col gap-3" th:action="@{/word/login}" method="post">
        <div class="flex flex-col items-center text-center">
            <img th:src="@{/brand/bildmarke-farbig.svg}" alt="" class="h-10 w-auto dark:hidden">
            <img th:src="@{/brand/bildmarke-weiss.svg}" alt="" class="h-10 w-auto hidden dark:block">
            <h1 class="text-lg mt-3">CiteOlivia für Word</h1>
            <p class="text-base-content/70">Melde dich an, um Zitate aus deinen Projekten einzufügen.</p>
        </div>
        <div th:if="${param.error}" role="alert" class="alert alert-error">E-Mail oder Passwort falsch.</div>
        <div th:if="${param.logout}" role="alert" class="alert alert-info">Du wurdest abgemeldet.</div>
        <label class="floating-label">
            <span>E-Mail</span>
            <input class="input w-full" type="email" name="email" placeholder="E-Mail" autocomplete="username" required autofocus>
        </label>
        <label class="floating-label">
            <span>Passwort</span>
            <input class="input w-full" type="password" name="password" placeholder="Passwort" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary">Anmelden</button>
        <p class="text-base-content/70">Noch kein Konto? Registriere dich auf
            <a class="link link-primary" th:href="@{/register}" target="_blank" rel="noopener">CiteOlivia</a>.</p>
    </form>
</main>
</body>
</html>
