<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${project.name}, ~{::main})}">
<body>
<main class="flex-1 w-full max-w-6xl mx-auto px-4 lg:px-8 py-8">
    <div th:replace="~{fragments/project :: projectHeader('settings')}"></div>

    <div class="grid lg:grid-cols-3 gap-6">
        <form class="card bg-base-100 border border-base-300 lg:col-span-2"
              th:action="@{/projects/{id}/settings(id=${project.id})}" th:object="${form}" method="post">
            <div class="card-body">
                <h2 class="card-title">Projekt</h2>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">Name</legend>
                    <input class="input w-full" type="text" th:field="*{name}" required
                           th:classappend="${#fields.hasErrors('name')} ? 'input-error'">
                    <p class="text-sm text-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">Beschreibung</legend>
                    <textarea class="textarea w-full" rows="3" th:field="*{description}"></textarea>
                </fieldset>
                <fieldset class="fieldset">
                    <legend class="fieldset-legend">Zitierstil</legend>
                    <select class="select w-full" th:field="*{citationStyle}">
                        <option th:each="s : ${citationStyles}" th:value="${s}" th:text="${s.label}">APA</option>
                    </select>
                </fieldset>
                <div class="card-actions mt-2">
                    <button type="submit" class="btn btn-primary">Speichern</button>
                </div>
            </div>
        </form>

        <div class="card bg-base-100 border border-error/40">
            <div class="card-body">
                <h2 class="card-title">Projekt löschen</h2>
                <p class="text-sm text-base-content/70">Löscht das Projekt mit allen Titeln, Wissenselementen und der Gliederung. Das kann nicht rückgängig gemacht werden.</p>
                <button class="btn btn-error btn-outline mt-2"
                        th:hx-post="@{/projects/{id}/delete(id=${project.id})}"
                        th:hx-confirm="|Projekt „${project.name}“ mit allen Inhalten endgültig löschen?|">Projekt löschen</button>
            </div>
        </div>
    </div>
</main>
</body>
</html>
