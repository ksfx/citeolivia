spring.application.name=cite-olivia
server.port=8080
# Behind the Caddy reverse proxy (https://www.citeolivia.com): trust X-Forwarded-* from internal proxy
# addresses only (Tomcat default: 10/8, 192.168/16, 172.16/12, 127/8, ...), so that the app knows the
# original scheme is https (absolute redirects, Secure session cookie).
server.forward-headers-strategy=native

# --- Database (override via env: DB_URL, DB_USER, DB_PASSWORD) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/citeolivia}
spring.datasource.username=${DB_USER:citeolivia}
spring.datasource.password=${DB_PASSWORD:citeolivia}

# --- Flyway: schema is created exclusively via migrations ---
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# --- Sessions in PostgreSQL (tables created by Flyway V2) ---
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
# Session cookies (SESSION: HttpOnly, SameSite=Lax; Word add-in: CO_WORD_SESSION) are defined in
# com.citeolivia.security.SessionCookieConfig.

# --- Public address (used for absolute URLs in the Word add-in manifest; override via PUBLIC_URL) ---
citeolivia.public-url=${PUBLIC_URL:https://www.citeolivia.com}

# --- Actuator: health public, everything else for ADMIN only ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# --- Uploads (PDF attachments up to 50 MB each, several per request; BibTeX import limited in code) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
# Read oversized requests completely so that a friendly error page can be sent instead of a connection reset
server.tomcat.max-swallow-size=210MB
